name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # A daily run reports a new advisory against the unchanged default branch.
  schedule:
    - cron: "37 8 * * *"

# Each job declares the permissions it needs.
permissions:
  contents: read

concurrency:
  # A draft run gets a group of its own, so it never cancels the ready run.
  group: >-
    ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number ||
    github.ref_name }}${{ github.event.pull_request.draft && '-draft' || '' }}
  cancel-in-progress: true

env:
  # Tests that create git repositories get main as their first branch,
  # whatever the runner image's git defaults to.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # The CI profile; local work loads dev from .miserc.toml, which CI never does.
  MISE_ENV: ci

jobs:
  # Whether a pull request changes anything the build reads. Documentation is
  # the root's Markdown files, docs/, and openspec/. A documentation file
  # still counts as a build input when a Go source names its path.
  changes:
    name: Changes
    # It runs on a pull request and a merge group.
    # A merge group compares its head with its base, so a group of
    # documentation-only pull requests skips the build in the queue too.
    # It runs the repository checks instead.
    if: >-
      ${{ !github.event.pull_request.draft && github.event_name != 'push'
      && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A merge group diffs with git from its base commit.
          # A job with no credentials cannot fetch that commit later in a
          # private repository, so its checkout takes the whole history.
          # The '0' is a string, so the || does not drop it.
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || '1' }}
      - name: Decide whether to build
        id: scope
        uses: victor-software-house/actions/build-scope@e9cf7ef0da4f4a9a7a6f978f5dd54be0d0d539bc # main, 2026-11-26
        with:
          go: true

  build:
    name: Build and test
    needs: changes
    # A documentation-only pull request or merge group skips the build, and
    # the checks job below runs the repository checks instead.
    # The Changes job is skipped on a push and a dispatch, and its output is
    # then empty. The build therefore runs there, and when Changes itself
    # failed.
    if: >-
      ${{ !cancelled() && !github.event.pull_request.draft
      && needs.changes.outputs.build != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 31
    outputs:
      cache-saved: >-
        ${{ steps.cache_save.outcome == 'success' }}
    permissions:
      contents: read
      # A check:versions task reads a pull request that changes a manifest
      # version, to tell a version pull request apart from a hand edit.
      pull-requests: read
      # The mise action exchanges the job's token for the release mirror's.
      id-token: write
    steps:
      - name: Check out repository
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked tools
        timeout-minutes: 5
        uses: victor-software-house/actions/mise@e9cf7ef0da4f4a9a7a6f978f5dd54be0d0d539bc # main, 2026-11-26
        with:
          mirror-url: ${{ secrets.RELEASE_MIRROR_URL }}
          mirror-key: ${{ secrets.RELEASE_MIRROR_CI_KEY }}
          version: 2026.11.12
          # Only a run on the default branch writes the tools cache, as with
          # the build caches below.
          # A pull request or a merge group adds no entry of its own.
          cache_save: >-
            ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      # The pinned Go reports where its caches live. They are the module cache
      # and the build cache, which differ between macOS and Linux.
      # Compiled packages never carry across toolchains, so the Go version is in
      # the key. The key ends in the run, as the SwiftPM key does.
      - name: Locate the Go caches
        id: go
        shell: bash
        env:
          SUMS: ${{ hashFiles('**/go.sum') }}
        run: |
          version=$(mise x -- go env GOVERSION | tr -c 'A-Za-z0-9.' '-')
          {
            echo "version=$version"
            echo "prefix=go-$RUNNER_OS-$RUNNER_ARCH-$version-"
            echo "sum=$SUMS"
            echo "mod=$(mise x -- go env GOMODCACHE)"
            echo "build=$(mise x -- go env GOCACHE)"
          } >>"$GITHUB_OUTPUT"
      - name: Restore the Go module and build caches
        id: cache
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ steps.go.outputs.mod }}
            ${{ steps.go.outputs.build }}
          key: "${{ steps.go.outputs.prefix }}${{ steps.go.outputs.sum }}-\
            ${{ github.run_id }}-${{ github.run_attempt }}"
          restore-keys: |
            ${{ steps.go.outputs.prefix }}${{ steps.go.outputs.sum }}-
            ${{ steps.go.outputs.prefix }}
      - name: Run go:verify
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run go:verify
      - name: Run go:vuln
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run go:vuln
      # Only a run on the default branch saves.
      # A pull request, a merge group and a run on another branch restore and
      # never write. No entry that another run restores therefore comes from
      # unreviewed code.
      #
      # A merge group's entry sits on its own branch, which no pull request
      # restores from. A repository that lands through a merge queue has no
      # push run. Its daily refresh therefore dispatches CI on the default
      # branch.
      - name: Save the Go module and build caches
        id: cache_save
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ steps.go.outputs.mod }}
            ${{ steps.go.outputs.build }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # A documentation-only change skips the build, and the repository checks that
  # its task runs with it. This job gives such a change every repository check
  # on the light runner, without the native build. It runs exactly when the
  # build is skipped.
  checks:
    name: Repository checks
    needs: changes
    if: >-
      ${{ !cancelled() && !github.event.pull_request.draft
      && needs.changes.outputs.build == 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      # The mise action exchanges the job's token for the release mirror's.
      id-token: write
    steps:
      - name: Check out repository
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # mise installs each task's tools as the task runs.
      - name: Install mise
        timeout-minutes: 5
        uses: victor-software-house/actions/mise@e9cf7ef0da4f4a9a7a6f978f5dd54be0d0d539bc # main, 2026-11-26
        with:
          mirror-url: ${{ secrets.RELEASE_MIRROR_URL }}
          mirror-key: ${{ secrets.RELEASE_MIRROR_CI_KEY }}
          version: 2026.11.12
          install: "false"
          # Only a run on the default branch writes the tools cache, as in the
          # build.
          cache_save: >-
            ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Run check:repo
        run: mise run check:repo

  # Each cache key ends in the run.
  # A run on the default branch that saved therefore leaves one entry of each
  # cache. This job deletes the older ones, newest kept.
  #
  # Only a run on the default branch saves, so cache-saved is true only there.
  # Only such a run needs the permission to delete.
  # Changes skips on a dispatch and on the daily refresh, the runs that save.
  # !cancelled() keeps that skip from skipping this job too.
  prune:
    name: Prune superseded caches
    needs: build
    if: >-
      ${{ !cancelled() && !github.event.pull_request.draft
      && needs.build.outputs.cache-saved == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Delete the superseded entries
        uses: victor-software-house/actions/prune-caches@e9cf7ef0da4f4a9a7a6f978f5dd54be0d0d539bc # main, 2026-11-26
        with:
          prefixes: go-

  # The one check a ruleset requires: it reports on every pull request and
  # merge queue run. It fails when the build or the repository checks failed or
  # were cancelled. A job skipped by its own condition counts as passing, as the
  # build does on a documentation-only pull request.
  verify:
    name: Verify
    needs: [changes, build, checks]
    if: ${{ always() && !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    # Reads this run and its newer runs.
    permissions:
      actions: read
    steps:
      - uses: victor-software-house/actions/verify-jobs@e9cf7ef0da4f4a9a7a6f978f5dd54be0d0d539bc # main, 2026-11-26
        with:
          needs: ${{ toJSON(needs) }}
          jobs: "build checks"
